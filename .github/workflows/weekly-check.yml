name: Weekly calendar check

on:
  push:
    paths:
      - "data/events.json"
      - "scripts/build_calendar.py"
  schedule:
    # Every Monday 08:00 Asia/Taipei (Monday 00:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate official source URLs
        run: python scripts/check_sources.py

      - name: Rebuild ICS calendar
        run: python scripts/build_calendar.py

      - name: Commit generated calendar when changed
        run: |
          if git diff --quiet -- china-political-calendar.ics; then
            echo "No calendar changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add china-political-calendar.ics
          git commit -m "chore: rebuild China calendar"
          git push
